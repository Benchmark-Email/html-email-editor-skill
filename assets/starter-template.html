<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Email title</title>
  <!--[if mso]>
  <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  <![endif]-->
  <style>
    /* Progressive enhancement only. This email must still work with this block deleted. */
    body { margin:0 !important; padding:0 !important; width:100% !important; }
    table { border-collapse:collapse; }
    img { -ms-interpolation-mode:bicubic; }
    a { text-decoration:none; }
    @media only screen and (max-width:600px) {
      .px { padding-left:20px !important; padding-right:20px !important; }
      .h1 { font-size:26px !important; line-height:32px !important; }
      .btn a { display:block !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#F4F4F5;">


  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F4F4F5;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%; max-width:600px; background-color:#FFFFFF;">

          <!-- Header / logo -->
          <tr>
            <td class="px" align="left" style="padding:28px 32px 20px 32px; background-color:#FFFFFF;">
              <img src="https://REPLACE-WITH-YOUR-DOMAIN/logo.png"
                   alt="Your company name"
                   width="150"
                   style="display:block; border:0; width:150px; max-width:150px; height:auto;">
            </td>
          </tr>

          <!-- Hero image -->
          <tr>
            <td align="center" bgcolor="#E4E4E7" style="background-color:#E4E4E7; font-size:0; line-height:0;">
              <img src="https://REPLACE-WITH-YOUR-DOMAIN/hero.jpg"
                   alt="Describe this image so it still makes sense when images are blocked"
                   width="600"
                   style="display:block; border:0; width:100%; max-width:600px; height:auto;">
            </td>
          </tr>

          <!-- Headline -->
          <tr>
            <td class="px" align="left" style="padding:32px 32px 12px 32px;">
              <h1 class="h1" style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:30px; line-height:38px; font-weight:bold; color:#18181B; mso-line-height-rule:exactly;">
                Your headline goes here
              </h1>
            </td>
          </tr>

          <!-- Body copy -->
          <tr>
            <td class="px" align="left" style="padding:0 32px 8px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:26px; color:#3F3F46; mso-line-height-rule:exactly;">
              <p style="margin:0 0 16px 0;">Hi FIRST_NAME_HERE,</p>
              <p style="margin:0 0 16px 0;">First paragraph of body copy. Keep sentences short and the point up front.</p>
              <p style="margin:0;">Second paragraph. Everything here is real selectable text, never an image of text.</p>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td class="px btn" align="left" style="padding:24px 32px 8px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#3C247F" style="background-color:#3C247F; border-radius:6px;">
                    <!--[if mso]>&nbsp;&nbsp;<![endif]-->
                    <a href="https://REPLACE-WITH-YOUR-DOMAIN/landing-page"
                       style="display:inline-block; padding:14px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:20px; font-weight:bold; color:#FFFFFF; background-color:#3C247F; text-decoration:none; border-radius:6px; mso-line-height-rule:exactly;">
                      Your Button Text
                    </a>
                    <!--[if mso]>&nbsp;&nbsp;<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td class="px" style="padding:28px 32px 0 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr><td style="height:1px; line-height:1px; font-size:0; background-color:#E4E4E7;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- Sign-off. Nothing goes after this: Benchmark adds the compliance footer. -->
          <tr>
            <td class="px" align="left" style="padding:24px 32px 36px 32px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#52525B; mso-line-height-rule:exactly;">
              <p style="margin:0;">Thanks for reading,</p>
              <p style="margin:0; font-weight:bold; color:#18181B;">Your name</p>
              <p style="margin:0;">Your title, Your company</p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
